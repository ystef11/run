.apm-container {
  width: 100%;
  border-bottom-left-radius: 8px;
  border-bottom-right-radius: 8px;
  overflow: hidden;
  margin-top: 10px;
}

/* ── Shared chart section styles ── */
.ac-container {
  border-top: 1px solid #333;
  padding-top: 16px;
  margin-top: 16px;
}

.ac-title {
  color: white !important;
  font-size: 18px;
  font-weight: 700;
  margin: 0 0 8px 0;
}

.ac-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.ac-title-row .ac-title {
  margin-bottom: 0;
}

.ac-expand-btn {
  background: none;
  border: none;
  color: #2d8cec;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 8px;
}

.ac-expand-btn:hover {
  opacity: 0.8;
}

.ac-stats-row {
  display: flex;
  gap: 24px;
  margin-bottom: 12px;
}

.ac-stat {
  display: flex;
  flex-direction: column;
}

.ac-stat-label {
  color: #888 !important;
  font-size: 12px;
  font-weight: 500;
}

.ac-stat-value {
  color: white !important;
  font-size: 15px;
  font-weight: 700;
}

/* ── Chart tooltip ── */
.ac-tooltip {
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 8px;
  padding: 8px 12px;
}

.ac-tooltip-label {
  color: rgba(255, 255, 255, 0.7) !important;
  font-size: 11px;
  margin: 0 0 2px 0;
}

.ac-tooltip-value {
  color: white !important;
  font-size: 14px;
  font-weight: 700;
  margin: 0;
}

.ac-tooltip-sub {
  color: rgba(255, 255, 255, 0.5) !important;
  font-size: 12px;
  margin: 2px 0 0 0;
}

/* ── Splits Table ── */
.ast-container {
  border-top: 1px solid #333;
  padding-top: 16px;
  margin-top: 16px;
}

.ast-title {
  color: white !important;
  font-size: 18px;
  font-weight: 700;
  margin: 0 0 12px 0;
}

.ast-table {
  width: 100%;
}

.ast-header-row {
  display: flex;
  align-items: center;
  padding: 4px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  margin-bottom: 4px;
}

.ast-header-row .ast-cell {
  color: #888 !important;
  font-size: 12px;
  font-weight: 500;
}

.ast-data-row {
  display: flex;
  align-items: center;
  padding: 6px 0;
}

.ast-cell {
  color: white;
  font-size: 13px;
}

.ast-cell-index {
  width: 40px;
  flex-shrink: 0;
  text-align: center;
}

.ast-cell-pace {
  width: 55px;
  flex-shrink: 0;
  font-weight: 600;
}

.ast-cell-bar {
  flex: 1;
  padding: 0 8px;
  min-width: 0;
}

.ast-bar {
  height: 20px;
  border-radius: 3px;
  background: linear-gradient(to right, rgba(45, 140, 236, 0.2), rgba(45, 140, 236, 0.8));
}

.ast-cell-elev {
  width: 45px;
  flex-shrink: 0;
  text-align: right;
  color: #888 !important;
  font-size: 12px;
}

.ast-cell-hr {
  width: 40px;
  flex-shrink: 0;
  text-align: right;
  color: #888 !important;
  font-size: 12px;
}

/* ── Laps detail table ── */
.alc-details {
  margin-top: 12px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding-top: 8px;
}

.alc-details-header {
  display: flex;
  padding: 4px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  margin-bottom: 4px;
}

.alc-details-header .alc-col {
  color: #888 !important;
  font-size: 12px;
  font-weight: 500;
}

.alc-details-row {
  display: flex;
  padding: 5px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
}

.alc-col {
  color: white;
  font-size: 13px;
}

.alc-col-lap {
  width: 36px;
  flex-shrink: 0;
  text-align: center;
}

.alc-col-time {
  flex: 1;
}

.alc-col-dist {
  flex: 1;
}

.alc-col-pace {
  flex: 1;
  font-weight: 600;
}

.alc-col-cad {
  width: 44px;
  flex-shrink: 0;
  text-align: right;

.create-post-editor .ql-toolbar.ql-snow {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px 8px 0 0;
}

.create-post-editor .ql-container.ql-snow {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-top: none;
  border-radius: 0 0 8px 8px;
  font-size: 16px;
  min-height: 250px;
}

.create-post-editor .ql-editor {
  color: #ecedee;
  min-height: 250px;
  line-height: 1.6;
  font-family:
    'Inter',
    'Manrope',
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    sans-serif;
}

.create-post-editor .ql-editor.ql-blank::before {
  color: #828583;
  font-style: normal;
}

/* Toolbar icons */
.create-post-editor .ql-snow .ql-stroke {
  stroke: #bdc3c7;
}

.create-post-editor .ql-snow .ql-fill {
  fill: #bdc3c7;
}

.create-post-editor .ql-snow .ql-picker {
  color: #bdc3c7;
}

.create-post-editor .ql-snow .ql-picker-label {
  color: #bdc3c7;
}

/* Toolbar icon hover */
.create-post-editor .ql-snow button:hover .ql-stroke,
.create-post-editor .ql-snow .ql-picker-label:hover .ql-stroke {
  stroke: #ffffff;
}

.create-post-editor .ql-snow button:hover .ql-fill,
.create-post-editor .ql-snow .ql-picker-label:hover .ql-fill {
  fill: #ffffff;
}

.create-post-editor .ql-snow button:hover,
.create-post-editor .ql-snow .ql-picker-label:hover {
  color: #ffffff;
}

/* Active toolbar state */
.create-post-editor .ql-snow button.ql-active .ql-stroke,
.create-post-editor .ql-snow .ql-picker-label.ql-active .ql-stroke {
  stroke: #2d8cec;
}

.create-post-editor .ql-snow button.ql-active .ql-fill,
.create-post-editor .ql-snow .ql-picker-label.ql-active .ql-fill {
  fill: #2d8cec;
}

.create-post-editor .ql-snow button.ql-active,
.create-post-editor .ql-snow .ql-picker-label.ql-active {
  color: #2d8cec;
}

/* Picker (header) dropdown */
.create-post-editor .ql-snow .ql-picker-options {
  background: #1b1b1b;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 8px;
  padding: 4px;
}

.create-post-editor .ql-snow .ql-picker-item {
  color: #bdc3c7;
}

.create-post-editor .ql-snow .ql-picker-item:hover {
  color: #ffffff;
}

.create-post-editor .ql-snow .ql-picker-item.ql-selected {
  color: #2d8cec;
}

/* Link / tooltip popup */
.create-post-editor .ql-snow .ql-tooltip {
  background: #1b1b1b;
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #ecedee;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}

.create-post-editor .ql-snow .ql-tooltip input[type='text'] {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #ffffff;
  border-radius: 4px;
  padding: 4px 8px;
  outline: none;
}

.create-post-editor .ql-snow .ql-tooltip input[type='text']:focus {
  border-color: #2d8cec;
}

.create-post-editor .ql-snow .ql-tooltip a {
  color: #2d8cec;
}

.create-post-editor .ql-snow .ql-tooltip a.ql-action::after,
.create-post-editor .ql-snow .ql-tooltip a.ql-remove::before {
  color: #2d8cec;
}

/* Code block */
.create-post-editor .ql-snow .ql-editor pre.ql-syntax {
  background: rgba(255, 255, 255, 0.05);
  color: #ecedee;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
}

/* Blockquote */
.create-post-editor .ql-snow .ql-editor blockquote {
  border-left: 3px solid #2d8cec;
  color: rgba(255, 255, 255, 0.75);
}

/* Links inside editor */
.create-post-editor .ql-snow .ql-editor a {
  color: #2d8cec;
}

/* Scrollbar styling for editor */
.create-post-editor .ql-editor::-webkit-scrollbar {
  width: 6px;
}

.create-post-editor .ql-editor::-webkit-scrollbar-track {
  background: transparent;
}

.create-post-editor .ql-editor::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 3px;

  padding: 16px;
  border-radius: 16px;
  margin-bottom: 16px;
  transition: all 0.3s ease;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid rgba(255, 255, 255, 0.15);
  box-shadow:
    0 25px 50px rgba(0, 0, 0, 0.2),
    0 8px 32px rgba(0, 0, 0, 0.15),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

.week-row:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.25);
  transform: translateY(-2px);
  box-shadow:
    0 30px 60px rgba(0, 0, 0, 0.3),
    0 12px 40px rgba(0, 0, 0, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

/* Completed week state — matches mobile #141C23 bg + primary border */
.week-row.week-row--completed {
  background: rgba(20, 28, 35, 0.85);
  border-color: #2d8cec;
}

.week-row.week-row--completed:hover {
  background: rgba(20, 28, 35, 0.95);
  border-color: #4da3f7;
}

/* Skipped week state — reduced opacity */
.week-row.week-row--skipped {
  background: rgba(108, 117, 125, 0.2);
  border-color: rgba(255, 255, 255, 0.1);
  opacity: 0.6;
}

.week-row.week-row--skipped:hover {
  opacity: 0.8;
}

/* Responsive: stack workout tiles if too tight */
@media (max-width: 480px) {
  .week-row {
    padding: 12px;
  }
}
